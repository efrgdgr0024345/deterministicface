name: Repository CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: repository-${{ github.ref }}
  cancel-in-progress: true
jobs:
  repository-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, pinned
        with:
          persist-credentials: false
      - name: Check repository contract
        run: python3 tools/check_repository.py
      - name: Test repository validators
        run: python3 -m unittest discover -s tools -p 'test_*.py' -v
      - name: Verify deterministic derivation vectors
        run: python3 tools/check_vectors.py
